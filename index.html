<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141B22">
<title>Vergunningsroute</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --diep:#141B22;
  --paneel:#1D2731;
  --paneel-2:#26333F;
  --rand:#38485A;
  --ink:#EDF3F7;
  --ink-zacht:#93A5B5;
  --net:#FFB100;
  --aanloop:#5FC7FF;
  --alarm:#FF4D3D;
  --ok:#34C77B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--diep);color:var(--ink);
  display:flex;flex-direction:column;
  font-size:16px;line-height:1.45;
  overscroll-behavior:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ---- kop ---- */
.streep{
  height:6px;flex:none;
  background:repeating-linear-gradient(115deg,#E03123 0 14px,#F5F2EE 14px 28px);
}
header{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--paneel);border-bottom:1px solid var(--rand);
}
header h1{font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
header h1 span{display:block;font-size:12px;font-weight:500;color:var(--ink-zacht)}
.kopknop{
  padding:7px 11px;border-radius:8px;background:var(--paneel-2);
  border:1px solid var(--rand);font-size:13px;font-weight:600;color:var(--ink-zacht)
}
.kopknop:active{background:var(--rand)}

/* ---- kaart ---- */
#kaart{flex:1;min-height:120px;background:#0E141A}
.leaflet-container{background:#0E141A;font-family:inherit}

/* ---- onderpaneel ---- */
#blad{
  flex:none;background:var(--paneel);border-top:1px solid var(--rand);
  max-height:62vh;overflow-y:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));
}
.veld{position:relative;margin-bottom:9px}
.veld label{
  display:block;font-size:12px;font-weight:600;color:var(--ink-zacht);margin-bottom:4px
}
.invoerrij{display:flex;gap:8px}
.invoerrij input{
  flex:1;min-width:0;padding:12px 12px;border-radius:10px;
  background:var(--paneel-2);border:1px solid var(--rand);
}
.invoerrij input:focus{outline:2px solid var(--net);outline-offset:-1px}
.hier{
  flex:none;width:46px;border-radius:10px;background:var(--paneel-2);
  border:1px solid var(--rand);font-size:19px;display:grid;place-items:center
}
.hier:active{background:var(--rand)}
.suggesties{
  position:absolute;z-index:1200;left:0;right:0;top:100%;margin-top:4px;
  background:var(--paneel-2);border:1px solid var(--rand);border-radius:10px;
  overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none
}
.suggesties button{
  display:block;width:100%;text-align:left;padding:11px 12px;font-size:14px;
  border-bottom:1px solid var(--rand)
}
.suggesties button:last-child{border-bottom:none}
.suggesties button:active{background:var(--rand)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{
  padding:8px 11px;border-radius:999px;background:var(--paneel-2);
  border:1px solid var(--rand);font-size:13px;font-weight:600;color:var(--ink-zacht)
}
.chip.aan{background:var(--net);border-color:var(--net);color:#1A1200}

.schuif{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.schuif input{flex:1;accent-color:var(--net)}
.schuif b{font-variant-numeric:tabular-nums;font-size:14px;min-width:52px;text-align:right}

.hoofdknop{
  width:100%;padding:15px;border-radius:12px;background:var(--net);color:#1A1200;
  font-weight:700;font-size:17px;letter-spacing:-.01em
}
.hoofdknop:disabled{opacity:.5}
.hoofdknop:active{transform:translateY(1px)}
.tweede{
  width:100%;padding:13px;border-radius:12px;background:var(--paneel-2);
  border:1px solid var(--rand);font-weight:600;font-size:15px;margin-top:8px
}
.tweede:active{background:var(--rand)}
.tweede.stop{background:var(--alarm);border-color:var(--alarm);color:#fff}

#melding{
  margin:10px 0 0;padding:11px 12px;border-radius:10px;font-size:14px;
  background:var(--paneel-2);border-left:3px solid var(--rand);display:none
}
#melding.bezig{border-left-color:var(--net)}
#melding.fout{border-left-color:var(--alarm)}
#melding.goed{border-left-color:var(--ok)}

#uitslag{display:none;margin-top:12px;border-top:1px solid var(--rand);padding-top:12px}
.cijfers{display:flex;gap:8px;margin-bottom:10px}
.cijfer{
  flex:1;background:var(--paneel-2);border-radius:10px;padding:9px 10px;
  border-top:3px solid var(--rand)
}
.cijfer.net{border-top-color:var(--net)}
.cijfer.aanl{border-top-color:var(--aanloop)}
.cijfer b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.cijfer i{font-style:normal;font-size:11.5px;color:var(--ink-zacht)}
.waarschuwing{
  background:rgba(255,77,61,.14);border:1px solid var(--alarm);
  border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px
}

/* ---- volgbanner ---- */
#volgbanner{
  display:none;flex:none;align-items:center;gap:12px;
  padding:11px 14px;background:var(--ok);color:#04220F;font-weight:700
}
#volgbanner.af{background:var(--alarm);color:#fff}
#volgbanner b{font-size:24px;font-variant-numeric:tabular-nums}
#volgbanner span{font-size:13px;font-weight:600}

/* ---- overlay (zelftest / logboek) ---- */
#overlay{
  position:fixed;inset:0;z-index:2000;background:rgba(10,14,18,.92);
  display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px 14px
}
#overlay h2{font-size:19px;margin-bottom:2px}
#overlay p.sub{font-size:13px;color:var(--ink-zacht);margin-bottom:14px}
#overlayinhoud{flex:1;overflow-y:auto}
.toets{
  display:flex;gap:11px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid var(--rand)
}
.toets .bol{
  flex:none;width:24px;height:24px;border-radius:50%;background:var(--rand);
  display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px
}
.toets.goed .bol{background:var(--ok);color:#04220F}
.toets.fout .bol{background:var(--alarm);color:#fff}
.toets div b{display:block;font-size:14.5px}
.toets div small{color:var(--ink-zacht);font-size:12.5px;word-break:break-word}
#logboek{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--ink-zacht)
}
#logboek .r{color:var(--alarm)}
</style>
</head>
<body>

<div class="streep"></div>

<header>
  <h1>Vergunningsroute<span id="kopnet">netwerk 90 ton</span></h1>
  <button class="kopknop" id="btnTest">Zelftest</button>
  <button class="kopknop" id="btnLog">Log</button>
</header>

<div id="kaart"></div>

<div id="volgbanner">
  <b id="vbAfstand">—</b>
  <span id="vbLabel">tot bestemming</span>
  <button class="kopknop" id="vbStop" style="margin-left:auto">Stoppen</button>
</div>

<div id="blad">

  <div class="veld">
    <label for="vertrek">Vertrek</label>
    <div class="invoerrij">
      <input id="vertrek" type="text" autocomplete="off" placeholder="Straat en gemeente">
      <button class="hier" id="hierVertrek" title="Mijn locatie">◎</button>
    </div>
    <div class="suggesties" id="sugVertrek"></div>
  </div>

  <div class="veld">
    <label for="bestemming">Bestemming</label>
    <div class="invoerrij">
      <input id="bestemming" type="text" autocomplete="off" placeholder="Straat en gemeente">
      <button class="hier" id="hierBestemming" title="Mijn locatie">◎</button>
    </div>
    <div class="suggesties" id="sugBestemming"></div>
  </div>

  <div class="chips" id="netchips">
    <button class="chip aan" data-net="90t">90 ton</button>
    <button class="chip" data-net="108t">Kraan 108 t</button>
    <button class="chip" data-net="120t">120 ton</button>
    <button class="chip" data-net="asw">Autosnelwegen</button>
  </div>

  <div class="schuif">
    <label for="aanloop" style="margin:0;font-size:12px;font-weight:600;color:var(--ink-zacht)">Aanloop max.</label>
    <input id="aanloop" type="range" min="2" max="25" step="1" value="10">
    <b id="aanloopWaarde">10 km</b>
  </div>

  <button class="hoofdknop" id="bereken">Bereken route</button>
  <button class="tweede" id="toonNet">Toon het hele netwerk op de kaart</button>

  <div id="melding"></div>

  <div id="uitslag">
    <div class="cijfers">
      <div class="cijfer"><b id="cTotaal">—</b><i>totaal</i></div>
      <div class="cijfer net"><b id="cNet">—</b><i>op netwerk</i></div>
      <div class="cijfer aanl"><b id="cAanloop">—</b><i>aanloop</i></div>
    </div>
    <div class="waarschuwing" id="waarschuwing" style="display:none"></div>
    <button class="tweede" id="naarGoogle">Openen in Google Maps</button>
    <button class="tweede" id="volgen">Volgmodus starten</button>
  </div>

</div>

<div id="overlay">
  <h2 id="overlaytitel">Zelftest</h2>
  <p class="sub" id="overlaysub"></p>
  <div id="overlayinhoud"></div>
  <button class="tweede" id="overlaySluit" style="margin-top:12px">Sluiten</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";

/* ============ basis ============ */
var $ = function(id){ return document.getElementById(id); };
var WFS = "https://opendata.apps.mow.vlaanderen.be/opendata-geoserver/awv/wfs";
var OSRM = "https://router.project-osrm.org/route/v1/driving/";

var NETWERKEN = {
  "90t":  { laag:"awv:Uitzonderlijk_vervoer_klasse_90t",        naam:"90 ton" },
  "108t": { laag:"awv:Uitzonderlijk_vervoer_klasse_kraan_108t", naam:"kraan 108 ton" },
  "120t": { laag:"awv:Uitzonderlijk_vervoer_klasse_120t",       naam:"120 ton" },
  "asw":  { laag:"awv:Uitzonderlijk_vervoer_klasse_autosnelwegen", naam:"autosnelwegen" }
};

var log = [];
function noteer(tekst, isFout){
  var t = new Date().toTimeString().slice(0,8);
  log.push({ t:t, tekst:tekst, fout:!!isFout });
  if(log.length > 250) log.shift();
  if($("overlay").style.display === "flex" && $("overlaytitel").textContent === "Logboek") toonLog();
}
window.addEventListener("error", function(e){ noteer("JS-fout: " + e.message, true); });
window.addEventListener("unhandledrejection", function(e){
  noteer("Onafgevangen fout: " + (e.reason && e.reason.message ? e.reason.message : e.reason), true);
});

function melding(tekst, soort){
  var m = $("melding");
  if(!tekst){ m.style.display = "none"; return; }
  m.textContent = tekst;
  m.className = soort || "";
  m.style.display = "block";
}

/* ============ rekenwerk ============ */
var R_AARDE = 6371000;
function hav(a, b){
  var dLat = (b[0]-a[0]) * Math.PI/180;
  var dLon = (b[1]-a[1]) * Math.PI/180;
  var la1 = a[0]*Math.PI/180, la2 = b[0]*Math.PI/180;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2 * R_AARDE * Math.asin(Math.min(1, Math.sqrt(h)));
}
function lengteVan(lijn){
  var s = 0;
  for(var i=1;i<lijn.length;i++) s += hav(lijn[i-1], lijn[i]);
  return s;
}
function km(m){ return (m/1000).toFixed(1) + " km"; }

function puntNaarSegment(p, a, b){
  var latF = 111320, lonF = 111320 * Math.cos(p[0]*Math.PI/180);
  var px = (p[1]-a[1])*lonF, py = (p[0]-a[0])*latF;
  var bx = (b[1]-a[1])*lonF, by = (b[0]-a[0])*latF;
  var nn = bx*bx + by*by;
  var t = nn === 0 ? 0 : Math.max(0, Math.min(1, (px*bx + py*by)/nn));
  var dx = px - t*bx, dy = py - t*by;
  return Math.sqrt(dx*dx + dy*dy);
}

/* ============ graaf ============ */
var G = null;
function nieuweGraaf(){ G = { punten:[], index:new Map(), buren:[] }; }
function knoop(lat, lon){
  var k = Math.round(lat*1e5) + ":" + Math.round(lon*1e5);
  var id = G.index.get(k);
  if(id === undefined){
    id = G.punten.length;
    G.punten.push([lat, lon]);
    G.buren.push([]);
    G.index.set(k, id);
  }
  return id;
}
function verbind(a, b, w){
  if(a === b) return;
  G.buren[a].push({ n:b, w:w });
  G.buren[b].push({ n:a, w:w });
}

function bouwGraaf(features){
  nieuweGraaf();
  var gedraaid = 0, segmenten = 0;
  for(var f=0; f<features.length; f++){
    var g = features[f].geometry;
    if(!g) continue;
    var delen = (g.type === "MultiLineString") ? g.coordinates
              : (g.type === "LineString") ? [g.coordinates] : [];
    for(var d=0; d<delen.length; d++){
      var ruw = delen[d];
      var lijn = [];
      for(var i=0; i<ruw.length; i++){
        var x = ruw[i][0], y = ruw[i][1];
        if(Math.abs(x) > 1000 || Math.abs(y) > 1000){
          throw new Error("AWV-netwerk: de server stuurt Lambert-coördinaten in plaats van GPS-graden. Meld dit, de laag moet anders opgevraagd worden.");
        }
        // veiligheid: als de server lat/lon omdraait, corrigeren we dat
        if(Math.abs(x) > 20){ var t = x; x = y; y = t; gedraaid++; }
        lijn.push([y, x]);
      }
      for(var j=1; j<lijn.length; j++){
        var a = knoop(lijn[j-1][0], lijn[j-1][1]);
        var b = knoop(lijn[j][0], lijn[j][1]);
        verbind(a, b, hav(lijn[j-1], lijn[j]));
        segmenten++;
      }
    }
  }
  if(gedraaid) noteer("Coördinaten omgedraaid voor " + gedraaid + " punten (as-volgorde server).");
  var gedicht = dichtGaten(20);
  noteer("Graaf: " + G.punten.length + " knopen, " + segmenten + " segmenten, " + gedicht + " gaten gedicht.");
  return G.punten.length;
}

/* kleine gaten tussen losse wegstukken overbruggen, anders vindt Dijkstra niets */
function dichtGaten(maxMeter){
  var CEL_LAT = 0.0002, CEL_LON = 0.0003, cellen = new Map(), i, k;
  for(i=0; i<G.punten.length; i++){
    k = Math.floor(G.punten[i][0]/CEL_LAT) + ":" + Math.floor(G.punten[i][1]/CEL_LON);
    if(!cellen.has(k)) cellen.set(k, []);
    cellen.get(k).push(i);
  }
  var aantal = 0;
  for(i=0; i<G.punten.length; i++){
    var ci = Math.floor(G.punten[i][0]/CEL_LAT), cj = Math.floor(G.punten[i][1]/CEL_LON);
    for(var di=-1; di<=1; di++){
      for(var dj=-1; dj<=1; dj++){
        var lijst = cellen.get((ci+di) + ":" + (cj+dj));
        if(!lijst) continue;
        for(var m=0; m<lijst.length; m++){
          var j = lijst[m];
          if(j <= i) continue;
          var d = hav(G.punten[i], G.punten[j]);
          if(d > 0 && d <= maxMeter){ verbind(i, j, d); aantal++; }
        }
      }
    }
  }
  return aantal;
}

function Hoop(){ this.a = []; }
Hoop.prototype.push = function(it){
  var a = this.a; a.push(it);
  var i = a.length - 1;
  while(i > 0){
    var p = (i-1) >> 1;
    if(a[p].d <= a[i].d) break;
    var t = a[p]; a[p] = a[i]; a[i] = t; i = p;
  }
};
Hoop.prototype.pop = function(){
  var a = this.a;
  if(a.length === 0) return null;
  var top = a[0], laatste = a.pop();
  if(a.length){
    a[0] = laatste;
    var i = 0;
    for(;;){
      var l = 2*i+1, r = l+1, mi = i;
      if(l < a.length && a[l].d < a[mi].d) mi = l;
      if(r < a.length && a[r].d < a[mi].d) mi = r;
      if(mi === i) break;
      var t = a[mi]; a[mi] = a[i]; a[i] = t; i = mi;
    }
  }
  return top;
};

function dijkstra(zaden){
  var n = G.punten.length;
  var afst = new Float64Array(n), vorig = new Int32Array(n), i;
  for(i=0;i<n;i++){ afst[i] = Infinity; vorig[i] = -1; }
  var h = new Hoop();
  for(i=0;i<zaden.length;i++){
    var z = zaden[i];
    if(z.d < afst[z.id]){ afst[z.id] = z.d; h.push({ id:z.id, d:z.d }); }
  }
  var huidig;
  while((huidig = h.pop()) !== null){
    if(huidig.d > afst[huidig.id] + 1e-6) continue;
    var buren = G.buren[huidig.id];
    for(i=0;i<buren.length;i++){
      var nd = huidig.d + buren[i].w;
      if(nd < afst[buren[i].n] - 1e-6){
        afst[buren[i].n] = nd;
        vorig[buren[i].n] = huidig.id;
        h.push({ id:buren[i].n, d:nd });
      }
    }
  }
  return { afst:afst, vorig:vorig };
}

function nabijeKnopen(punt, maxMeter, aantal){
  var kand = [];
  for(var i=0;i<G.punten.length;i++){
    var d = hav(punt, G.punten[i]);
    if(d <= maxMeter) kand.push({ id:i, d:d });
  }
  kand.sort(function(a,b){ return a.d - b.d; });
  var gekozen = [];
  for(var j=0;j<kand.length && gekozen.length<aantal;j++){
    var ver = true;
    for(var g=0; g<gekozen.length; g++){
      if(hav(G.punten[gekozen[g].id], G.punten[kand[j].id]) < 400){ ver = false; break; }
    }
    if(ver) gekozen.push(kand[j]);
  }
  if(gekozen.length === 0 && kand.length) gekozen.push(kand[0]);
  return gekozen;
}

/* ============ externe diensten ============ */
async function haalJson(url, wat, msTimeout){
  var ctrl = new AbortController();
  var tid = setTimeout(function(){ ctrl.abort(); }, msTimeout || 25000);
  try{
    var r = await fetch(url, { signal:ctrl.signal });
    if(!r.ok) throw new Error(wat + ": server antwoordt " + r.status);
    var tekst = await r.text();
    try{ return JSON.parse(tekst); }
    catch(e){ throw new Error(wat + ": antwoord is geen JSON (" + tekst.slice(0,90) + ")"); }
  }catch(e){
    if(e.name === "AbortError") throw new Error(wat + ": geen antwoord binnen de tijd");
    throw new Error(e.message || (wat + ": verbinding mislukt"));
  }finally{ clearTimeout(tid); }
}

function netwerkUrl(sleutel, bbox){
  var p = new URLSearchParams({
    service:"WFS", version:"1.0.0", request:"GetFeature",
    typeName: NETWERKEN[sleutel].laag,
    outputFormat:"application/json",
    srsName:"EPSG:4326",
    maxFeatures:"30000"
  });
  if(bbox) p.set("bbox", bbox.join(",") + ",EPSG:4326");
  return WFS + "?" + p.toString();
}

async function haalNetwerk(sleutel, bbox){
  var j = await haalJson(netwerkUrl(sleutel, bbox), "AWV-netwerk", 45000);
  if(!j.features) throw new Error("AWV-netwerk: geen wegen in het antwoord");
  noteer("AWV " + NETWERKEN[sleutel].naam + ": " + j.features.length + " wegvakken opgehaald.");
  return j.features;
}

async function zoekAdres(vraag){
  var lijst = [];
  try{
    var j = await haalJson(
      "https://geo.api.vlaanderen.be/geolocation/v4/Location?c=6&q=" + encodeURIComponent(vraag),
      "Adreszoeker", 12000);
    if(j && j.LocationResult){
      for(var i=0;i<j.LocationResult.length;i++){
        var r = j.LocationResult[i];
        if(!r.Location) continue;
        lijst.push({ naam: r.FormattedAddress || r.Municipality,
                     punt: [r.Location.Lat_WGS84, r.Location.Lon_WGS84] });
      }
    }
  }catch(e){ noteer("Adreszoeker Vlaanderen faalde: " + e.message, true); }

  if(lijst.length === 0){
    try{
      var n = await haalJson(
        "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=be&limit=6&q=" +
        encodeURIComponent(vraag), "Reservezoeker", 12000);
      for(var k=0;k<n.length;k++){
        lijst.push({ naam:n[k].display_name, punt:[parseFloat(n[k].lat), parseFloat(n[k].lon)] });
      }
    }catch(e2){ noteer("Reservezoeker faalde: " + e2.message, true); }
  }
  return lijst;
}

async function wegRoute(a, b){
  var url = OSRM + a[1] + "," + a[0] + ";" + b[1] + "," + b[0] +
            "?overview=full&geometries=geojson";
  var j = await haalJson(url, "Wegberekening", 20000);
  if(j.code !== "Ok" || !j.routes || !j.routes.length) throw new Error("Wegberekening: geen weg gevonden");
  var c = j.routes[0].geometry.coordinates, lijn = [];
  for(var i=0;i<c.length;i++) lijn.push([c[i][1], c[i][0]]);
  return { lijn:lijn, afstand:j.routes[0].distance };
}

/* ============ kaart ============ */
var kaart = L.map("kaart", { zoomControl:false, attributionControl:false }).setView([51.05, 4.05], 10);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom:19 }).addTo(kaart);
L.control.zoom({ position:"topright" }).addTo(kaart);

var laagNet = L.layerGroup().addTo(kaart);
var laagRoute = L.layerGroup().addTo(kaart);
var laagAchtergrond = L.layerGroup();
var markVertrek = null, markBestemming = null, markIk = null;

function tekenPunt(punt, kleur, titel){
  return L.circleMarker(punt, {
    radius:8, color:"#0E141A", weight:3, fillColor:kleur, fillOpacity:1
  }).bindTooltip(titel, { permanent:false });
}

/* ============ toestand ============ */
var toestand = {
  netwerk: "90t",
  vertrek: null,
  bestemming: null,
  route: null,
  volgId: null,
  netwerkCache: {}
};

/* ============ invoer + suggesties ============ */
function koppelZoeker(invoerId, sugId, welke){
  var invoer = $(invoerId), bak = $(sugId), timer = null;

  invoer.addEventListener("input", function(){
    toestand[welke] = null;
    clearTimeout(timer);
    var q = invoer.value.trim();
    if(q.length < 3){ bak.style.display = "none"; return; }
    timer = setTimeout(async function(){
      var res = await zoekAdres(q);
      bak.innerHTML = "";
      if(res.length === 0){
        bak.style.display = "none";
        melding("Geen adres gevonden voor \u201c" + q + "\u201d. Probeer straat + gemeente.", "fout");
        return;
      }
      for(var i=0;i<res.length;i++){
        (function(r){
          var b = document.createElement("button");
          b.textContent = r.naam;
          b.onclick = function(){
            invoer.value = r.naam;
            toestand[welke] = r.punt;
            bak.style.display = "none";
            zetMarker(welke, r.punt);
            melding("");
          };
          bak.appendChild(b);
        })(res[i]);
      }
      bak.style.display = "block";
    }, 350);
  });

  invoer.addEventListener("blur", function(){
    setTimeout(function(){ bak.style.display = "none"; }, 200);
  });
}

function zetMarker(welke, punt){
  if(welke === "vertrek"){
    if(markVertrek) kaart.removeLayer(markVertrek);
    markVertrek = tekenPunt(punt, "#34C77B", "Vertrek").addTo(kaart);
  }else{
    if(markBestemming) kaart.removeLayer(markBestemming);
    markBestemming = tekenPunt(punt, "#FF4D3D", "Bestemming").addTo(kaart);
  }
  var punten = [];
  if(toestand.vertrek) punten.push(toestand.vertrek);
  if(toestand.bestemming) punten.push(toestand.bestemming);
  if(punten.length === 2) kaart.fitBounds(L.latLngBounds(punten).pad(0.25));
  else kaart.setView(punt, 13);
}

function mijnLocatie(welke, invoerId){
  if(!navigator.geolocation){ melding("Deze browser geeft geen locatie door.", "fout"); return; }
  melding("Locatie zoeken\u2026", "bezig");
  navigator.geolocation.getCurrentPosition(function(p){
    var punt = [p.coords.latitude, p.coords.longitude];
    toestand[welke] = punt;
    $(invoerId).value = "Mijn locatie (" + punt[0].toFixed(5) + ", " + punt[1].toFixed(5) + ")";
    zetMarker(welke, punt);
    melding("Locatie gevonden, nauwkeurig tot ongeveer " + Math.round(p.coords.accuracy) + " m.", "goed");
    noteer("Locatie: " + punt[0].toFixed(5) + ", " + punt[1].toFixed(5));
  }, function(e){
    melding("Locatie lukt niet: " + e.message + ". Zet locatie aan voor deze pagina.", "fout");
    noteer("Locatiefout: " + e.message, true);
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
}

koppelZoeker("vertrek", "sugVertrek", "vertrek");
koppelZoeker("bestemming", "sugBestemming", "bestemming");
$("hierVertrek").onclick = function(){ mijnLocatie("vertrek", "vertrek"); };
$("hierBestemming").onclick = function(){ mijnLocatie("bestemming", "bestemming"); };

$("netchips").onclick = function(e){
  var b = e.target.closest(".chip");
  if(!b) return;
  var chips = document.querySelectorAll("#netchips .chip");
  for(var i=0;i<chips.length;i++) chips[i].classList.remove("aan");
  b.classList.add("aan");
  toestand.netwerk = b.dataset.net;
  $("kopnet").textContent = "netwerk " + NETWERKEN[toestand.netwerk].naam;
  laagAchtergrond.clearLayers();
};

$("aanloop").oninput = function(){ $("aanloopWaarde").textContent = this.value + " km"; };

/* ============ route berekenen ============ */
async function zorgVoorPunt(welke, invoerId){
  if(toestand[welke]) return toestand[welke];
  var q = $(invoerId).value.trim();
  if(q.length < 3) return null;
  var res = await zoekAdres(q);
  if(!res.length) return null;
  toestand[welke] = res[0].punt;
  $(invoerId).value = res[0].naam;
  zetMarker(welke, res[0].punt);
  noteer("Adres zelf ingevuld: " + res[0].naam);
  return res[0].punt;
}

$("bereken").onclick = async function(){
  var knop = this;
  knop.disabled = true;
  melding("Adressen opzoeken\u2026", "bezig");
  try{
    await zorgVoorPunt("vertrek", "vertrek");
    await zorgVoorPunt("bestemming", "bestemming");
  }catch(e){ noteer("Adres opzoeken mislukt: " + e.message, true); }

  if(!toestand.vertrek || !toestand.bestemming){
    melding("Ik vind geen coördinaten voor een van beide adressen. Typ straat + gemeente en kies uit de suggestielijst.", "fout");
    knop.disabled = false;
    return;
  }
  $("uitslag").style.display = "none";
  laagRoute.clearLayers();

  var maxAanloop = parseInt($("aanloop").value, 10) * 1000;

  try{
    melding("Netwerkkaart van AWV ophalen\u2026", "bezig");
    var a = toestand.vertrek, b = toestand.bestemming;
    var marge = 0.30; // ongeveer 25 tot 33 km rondom
    var bbox = [
      Math.min(a[1], b[1]) - marge, Math.min(a[0], b[0]) - marge*0.62,
      Math.max(a[1], b[1]) + marge, Math.max(a[0], b[0]) + marge*0.62
    ];
    var features = await haalNetwerk(toestand.netwerk, bbox);
    if(features.length === 0){
      melding("Geen enkele vergunningsweg in dit gebied. Kies een ander netwerk.", "fout");
      knop.disabled = false; return;
    }

    melding("Route zoeken over het netwerk\u2026", "bezig");
    await new Promise(function(r){ setTimeout(r, 30); });
    bouwGraaf(features);

    var inKand = nabijeKnopen(a, maxAanloop, 6);
    var uitKand = nabijeKnopen(b, maxAanloop, 6);
    if(inKand.length === 0 || uitKand.length === 0){
      melding("Binnen " + (maxAanloop/1000) + " km ligt er geen vergunningsweg. Schuif de aanloop hoger.", "fout");
      knop.disabled = false; return;
    }

    var zaden = inKand.map(function(c){ return { id:c.id, d:c.d*1.35 }; });
    var res = dijkstra(zaden);

    var beste = null;
    for(var i=0;i<uitKand.length;i++){
      var totaal = res.afst[uitKand[i].id] + uitKand[i].d*1.35;
      if(isFinite(totaal) && (!beste || totaal < beste.totaal)){
        beste = { totaal:totaal, id:uitKand[i].id };
      }
    }
    if(!beste){
      melding("Vertrek en bestemming hangen niet aan hetzelfde netwerkdeel. Vergroot de aanloop of kies een ander netwerk.", "fout");
      knop.disabled = false; return;
    }

    var pad = [], k = beste.id, veiligheid = 0;
    while(k !== -1 && veiligheid++ < 200000){ pad.push(G.punten[k]); k = res.vorig[k]; }
    pad.reverse();
    if(pad.length < 2){
      melding("De route valt volledig binnen de aanloop \u2014 het netwerk wordt hier niet gebruikt.", "fout");
      knop.disabled = false; return;
    }

    var netLengte = lengteVan(pad);

    melding("Aanloopwegen berekenen\u2026", "bezig");
    var heen = null, terug = null, geschat = false;
    try{ heen = await wegRoute(a, pad[0]); }
    catch(e){ heen = { lijn:[a, pad[0]], afstand:hav(a, pad[0])*1.35 }; geschat = true; noteer("Aanloop heen geschat: " + e.message, true); }
    try{ terug = await wegRoute(pad[pad.length-1], b); }
    catch(e){ terug = { lijn:[pad[pad.length-1], b], afstand:hav(pad[pad.length-1], b)*1.35 }; geschat = true; noteer("Aanloop terug geschat: " + e.message, true); }

    L.polyline(heen.lijn,  { color:"#5FC7FF", weight:5, dashArray:"9 8", opacity:.95 }).addTo(laagRoute);
    L.polyline(pad,        { color:"#FFB100", weight:7, opacity:.95 }).addTo(laagRoute);
    L.polyline(terug.lijn, { color:"#5FC7FF", weight:5, dashArray:"9 8", opacity:.95 }).addTo(laagRoute);
    kaart.fitBounds(L.polyline(heen.lijn.concat(pad, terug.lijn)).getBounds().pad(0.12));

    toestand.route = {
      pad:pad, heen:heen, terug:terug,
      volledig: heen.lijn.concat(pad, terug.lijn),
      netLengte:netLengte, aanloop: heen.afstand + terug.afstand
    };

    $("cTotaal").textContent   = km(netLengte + heen.afstand + terug.afstand);
    $("cNet").textContent      = km(netLengte);
    $("cAanloop").textContent  = km(heen.afstand + terug.afstand);

    var waarsch = [];
    if(heen.afstand  > maxAanloop) waarsch.push("De aanloop bij vertrek is " + km(heen.afstand) + " \u2014 meer dan je grens.");
    if(terug.afstand > maxAanloop) waarsch.push("De aanloop bij aankomst is " + km(terug.afstand) + " \u2014 meer dan je grens.");
    if(geschat) waarsch.push("Een aanloopstuk kon niet over de weg berekend worden en is geschat in vogelvlucht.");
    var w = $("waarschuwing");
    if(waarsch.length){ w.innerHTML = waarsch.join("<br>"); w.style.display = "block"; }
    else w.style.display = "none";

    $("uitslag").style.display = "block";
    melding("Route klaar. Controleer ze tegen wat je normaal rijdt.", "goed");
    noteer("Route: net " + km(netLengte) + ", aanloop " + km(heen.afstand + terug.afstand));

  }catch(e){
    melding(e.message, "fout");
    noteer("Route mislukt: " + e.message, true);
  }
  knop.disabled = false;
};

/* ============ netwerk tonen ============ */
$("toonNet").onclick = async function(){
  if(laagAchtergrond.getLayers().length){
    kaart.removeLayer(laagAchtergrond);
    laagAchtergrond.clearLayers();
    this.textContent = "Toon het hele netwerk op de kaart";
    return;
  }
  var knop = this;
  knop.disabled = true;
  melding("Netwerk van dit kaartbeeld ophalen\u2026", "bezig");
  try{
    var g = kaart.getBounds();
    if(g.getEast() - g.getWest() > 0.9){
      melding("Zoom eerst wat in. Zo ver uitgezoomd wordt de download te zwaar.", "fout");
      knop.disabled = false; return;
    }
    var bbox = [g.getWest(), g.getSouth(), g.getEast(), g.getNorth()];
    var features = await haalNetwerk(toestand.netwerk, bbox);
    var laag = L.geoJSON({ type:"FeatureCollection", features:features },
      { style:{ color:"#FFB100", weight:2.5, opacity:.5 } });
    laagAchtergrond.addLayer(laag);
    laagAchtergrond.addTo(kaart);
    knop.textContent = "Netwerk verbergen";
    melding(features.length + " wegvakken getekend. Zoom in om mee te kijken waar je mag rijden.", "goed");
  }catch(e){
    melding(e.message, "fout");
    noteer("Netwerk tonen mislukt: " + e.message, true);
  }
  knop.disabled = false;
};

/* ============ Google Maps ============ */
$("naarGoogle").onclick = function(){
  var r = toestand.route;
  if(!r) return;
  var cum = [0], i;
  for(i=1;i<r.pad.length;i++) cum.push(cum[i-1] + hav(r.pad[i-1], r.pad[i]));
  var totaal = cum[cum.length-1], punten = [];
  for(var n=1;n<=8;n++){
    var doel = totaal * n/9, j = 1;
    while(j < cum.length-1 && cum[j] < doel) j++;
    var p = r.pad[j];
    var laatste = punten[punten.length-1];
    if(!laatste || hav(laatste, p) > 300) punten.push(p);
  }
  var url = "https://www.google.com/maps/dir/?api=1" +
    "&origin=" + toestand.vertrek[0].toFixed(6) + "," + toestand.vertrek[1].toFixed(6) +
    "&destination=" + toestand.bestemming[0].toFixed(6) + "," + toestand.bestemming[1].toFixed(6) +
    "&travelmode=driving&waypoints=" +
    punten.map(function(p){ return p[0].toFixed(6) + "," + p[1].toFixed(6); }).join("|");
  noteer("Google Maps geopend met " + punten.length + " tussenstops.");
  window.open(url, "_blank");
};

/* ============ volgmodus ============ */
function stopVolgen(){
  if(toestand.volgId !== null){ navigator.geolocation.clearWatch(toestand.volgId); toestand.volgId = null; }
  $("volgbanner").style.display = "none";
  $("volgen").textContent = "Volgmodus starten";
  $("volgen").classList.remove("stop");
}
$("vbStop").onclick = stopVolgen;

$("volgen").onclick = function(){
  if(toestand.volgId !== null){ stopVolgen(); return; }
  var r = toestand.route;
  if(!r){ melding("Bereken eerst een route.", "fout"); return; }
  if(!navigator.geolocation){ melding("Deze browser geeft geen locatie door.", "fout"); return; }

  this.textContent = "Volgmodus stoppen";
  this.classList.add("stop");
  $("volgbanner").style.display = "flex";

  var pad = r.volledig, cum = [0], i;
  for(i=1;i<pad.length;i++) cum.push(cum[i-1] + hav(pad[i-1], pad[i]));
  var totaal = cum[cum.length-1];

  toestand.volgId = navigator.geolocation.watchPosition(function(p){
    var ik = [p.coords.latitude, p.coords.longitude];
    if(!markIk){
      markIk = L.circleMarker(ik, { radius:9, color:"#fff", weight:2, fillColor:"#5FC7FF", fillOpacity:1 }).addTo(kaart);
    }else markIk.setLatLng(ik);
    kaart.setView(ik, Math.max(kaart.getZoom(), 14));

    var besteD = Infinity, besteI = 0;
    for(var j=1;j<pad.length;j++){
      var d = puntNaarSegment(ik, pad[j-1], pad[j]);
      if(d < besteD){ besteD = d; besteI = j; }
    }
    var banner = $("volgbanner");
    if(besteD > 250){
      banner.classList.add("af");
      $("vbAfstand").textContent = Math.round(besteD) + " m";
      $("vbLabel").textContent = "naast de route \u2014 keer terug";
    }else{
      banner.classList.remove("af");
      $("vbAfstand").textContent = ((totaal - cum[besteI])/1000).toFixed(1) + " km";
      $("vbLabel").textContent = "tot bestemming";
    }
  }, function(e){
    melding("Volgmodus: " + e.message, "fout");
    noteer("Volgmodus fout: " + e.message, true);
    stopVolgen();
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:20000 });
};

/* ============ zelftest ============ */
function toonOverlay(titel, sub){
  $("overlaytitel").textContent = titel;
  $("overlaysub").textContent = sub || "";
  $("overlay").style.display = "flex";
}
$("overlaySluit").onclick = function(){ $("overlay").style.display = "none"; };

function testRegel(naam){
  var d = document.createElement("div");
  d.className = "toets";
  d.innerHTML = '<div class="bol">\u2026</div><div><b></b><small>bezig\u2026</small></div>';
  d.querySelector("b").textContent = naam;
  $("overlayinhoud").appendChild(d);
  return {
    goed: function(t){ d.className = "toets goed"; d.querySelector(".bol").textContent = "\u2713"; d.querySelector("small").textContent = t; },
    fout: function(t){ d.className = "toets fout"; d.querySelector(".bol").textContent = "\u2715"; d.querySelector("small").textContent = t; }
  };
}

$("btnTest").onclick = async function(){
  toonOverlay("Zelftest", "Controleert elk onderdeel apart, zodat je meteen ziet waar het strandt.");
  $("overlayinhoud").innerHTML = "";

  var r1 = testRegel("Kaarttegels");
  try{
    await fetch("https://a.basemaps.cartocdn.com/dark_all/10/524/343.png", { mode:"no-cors" });
    r1.goed("De kaartserver antwoordt.");
  }catch(e){ r1.fout(e.message); }

  var r2 = testRegel("AWV-netwerk " + NETWERKEN[toestand.netwerk].naam);
  try{
    var f = await haalNetwerk(toestand.netwerk, [3.95, 51.00, 4.15, 51.12]);
    if(f.length === 0) r2.fout("Verbinding werkt, maar er kwamen geen wegvakken terug.");
    else{
      var c = f[0].geometry.coordinates;
      var eerste = (f[0].geometry.type === "MultiLineString") ? c[0][0] : c[0];
      r2.goed(f.length + " wegvakken rond Zele. Eerste punt: " +
              eerste[0].toFixed(4) + ", " + eerste[1].toFixed(4));
    }
  }catch(e){ r2.fout(e.message); }

  var r3 = testRegel("Adres zoeken");
  try{
    var res = await zoekAdres("Zele");
    if(res.length) r3.goed(res.length + " treffers, bovenaan: " + res[0].naam);
    else r3.fout("Geen treffers. Beide zoekdiensten geven niets terug.");
  }catch(e){ r3.fout(e.message); }

  var r4 = testRegel("Wegberekening aanloop");
  try{
    var w = await wegRoute([51.0680, 4.0390], [51.0300, 4.1000]);
    r4.goed("Werkt, testroute is " + km(w.afstand) + ".");
  }catch(e){ r4.fout(e.message + " \u2014 aanlopen worden dan geschat in vogelvlucht."); }

  var r5 = testRegel("Locatie (GPS)");
  if(!navigator.geolocation) r5.fout("Deze browser geeft geen locatie door.");
  else{
    await new Promise(function(klaar){
      navigator.geolocation.getCurrentPosition(function(p){
        r5.goed("Gevonden, nauwkeurig tot ongeveer " + Math.round(p.coords.accuracy) + " m.");
        klaar();
      }, function(e){
        r5.fout(e.message + " \u2014 zet locatie aan voor deze pagina.");
        klaar();
      }, { enableHighAccuracy:true, timeout:15000 });
    });
  }

  var r6 = testRegel("Routezoeker");
  try{
    var fs = await haalNetwerk(toestand.netwerk, [3.90, 50.95, 4.35, 51.20]);
    bouwGraaf(fs);
    var A = nabijeKnopen([51.0680, 4.0390], 12000, 4);
    var B = nabijeKnopen([51.1450, 4.1400], 12000, 4);
    if(!A.length || !B.length) r6.fout("Geen vergunningsweg binnen 12 km van de testpunten.");
    else{
      var uit = dijkstra(A.map(function(c){ return { id:c.id, d:c.d*1.35 }; }));
      var best = Infinity;
      for(var i=0;i<B.length;i++) best = Math.min(best, uit.afst[B[i].id]);
      if(isFinite(best)) r6.goed("Testroute Zele \u2192 Temse gevonden over " + km(best) + " netwerk.");
      else r6.fout("De twee punten hangen niet aan elkaar in de graaf.");
    }
  }catch(e){ r6.fout(e.message); }
};

$("btnLog").onclick = function(){
  toonOverlay("Logboek", "Alles wat de app deed, met de exacte foutmeldingen.");
  toonLog();
};
function toonLog(){
  var h = "";
  for(var i=log.length-1;i>=0;i--){
    h += '<span class="' + (log[i].fout ? "r" : "") + '">' + log[i].t + "  " +
         log[i].tekst.replace(/[<>&]/g, function(c){ return { "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]; }) + "</span>\n";
  }
  $("overlayinhoud").innerHTML = '<div id="logboek">' + (h || "Nog niets gebeurd.") + "</div>";
}

noteer("App gestart.");

if(window.self !== window.top){
  noteer("Draait in een venster binnen een andere site \u2014 locatie en externe data worden daar geblokkeerd.", true);
  melding("Deze pagina draait in een venster binnen claude.ai. Daar mag ze geen locatie gebruiken en geen kaartdata ophalen. Zet het bestand op een eigen webadres, dan werkt alles.", "fout");
}
